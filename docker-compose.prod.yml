services:
  backend:
    build: ./blog-backend
    container_name: blog-backend
    environment:
      ARTICLES_PATH: /app/articles
      BLOG_CORS_ALLOWED_ORIGINS: ${BLOG_CORS_ALLOWED_ORIGINS}
      BLOG_ADMIN_TOKEN: "${BLOG_ADMIN_TOKEN:?请先在 .env.prod 中设置 BLOG_ADMIN_TOKEN（后台接口令牌）}"
      SHOP_CATALOG_PATH: /app/shop/catalog.json
      SHOP_DATA_PATH: /app/data/shop-orders.json
      SHOP_ALLOW_SELF_PAY: "false"
      LOGGING_LEVEL_COM_BLOG: INFO
      JAVA_OPTS: -Xms128m -Xmx512m -XX:MaxMetaspaceSize=128m -Dfile.encoding=UTF-8
      RELAY_CATALOG_PATH: /app/shop/relay.json
      RELAY_DATA_PATH: /app/data/relay-store.json
      RELAY_UPSTREAM_URL: ${RELAY_UPSTREAM_URL:-}
      RELAY_UPSTREAM_KEY: ${RELAY_UPSTREAM_KEY:-}
      RELAY_ALLOW_SELF_TOPUP: "false"
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_SSL: ${MAIL_SSL:-false}
      SITE_BASE_URL: ${SITE_BASE_URL:-https://wynneyin.site}
    volumes:
      - ./articles:/app/articles
      - ./shop:/app/shop:ro
      - ./data:/app/data
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build: ./blog-frontend
    container_name: blog-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
