server:
  port: 8080

spring:
  application:
    name: blog-backend

  cache:
    type: simple

  # Spring Boot always creates JavaMailSender from this block, even with an
  # empty host, so SmtpMailGateway also checks MAIL_HOST/MAIL_FROM at runtime.
  # Sending requires blog.mail.enabled=true and both values to be non-empty.
  # SMTP AUTH is disabled automatically when MAIL_USERNAME is empty.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${MAIL_STARTTLS:true}
      "[mail.smtp.ssl.enable]": ${MAIL_SSL:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

# 文章配置
articles:
  path: ${user.dir}/articles
  encoding: UTF-8

blog:
  admin-token: ${BLOG_ADMIN_TOKEN:}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
    site-base-url: ${SITE_BASE_URL:https://wynneyin.site}
  shop:
    catalog-path: ${SHOP_CATALOG_PATH:${user.dir}/shop/catalog.json}
    data-path: ${SHOP_DATA_PATH:${user.dir}/data/shop-orders.json}
    allow-self-pay: ${SHOP_ALLOW_SELF_PAY:true}
  relay:
    catalog-path: ${RELAY_CATALOG_PATH:${user.dir}/shop/relay.json}
    data-path: ${RELAY_DATA_PATH:${user.dir}/data/relay-store.json}
    upstream-url: ${RELAY_UPSTREAM_URL:}
    upstream-key: ${RELAY_UPSTREAM_KEY:}
    allow-self-topup: ${RELAY_ALLOW_SELF_TOPUP:true}
  cors:
    allowed-origins: ${BLOG_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# 日志配置
logging:
  level:
    com.blog: DEBUG
    org.springframework.web: INFO
